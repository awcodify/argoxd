version: 2

builds:
  - main: ./cmd/argoxd
    binary: argoxd
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

homebrew_casks:
  - name: argoxd
    repository:
      owner: awcodify
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/awcodify/argoxd
    description: Interactive terminal UI for Argo CD
    # The binary is not signed or notarized, so macOS would quarantine it and
    # refuse to run it. See https://goreleaser.com/customization/publish/homebrew_casks/
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/argoxd"]
          end

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^\s*feat(\(.*\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^\s*fix(\(.*\))?!?:'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs(\\(.*\\))?:"
      - "^test(\\(.*\\))?:"
      - "^chore(\\(release\\))?:"
