version: 2

builds:
  - main: ./cmd/argoxd
    binary: argoxd
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

brews:
  - name: argoxd
    repository:
      owner: awcodify
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/awcodify/argoxd
    description: Interactive terminal UI for Argo CD
    license: MIT
    test: |
      assert_match "Usage of argoxd", shell_output("#{bin}/argoxd -h 2>&1")

checksum:
  name_template: checksums.txt

changelog:
  filters:
    exclude:
      - "^docs:"
      - "^test:"
